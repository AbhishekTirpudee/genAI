version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: eventmind-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: eventmind_ai
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - eventmind-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventmind-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=eventmind_ai
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - AI_DEMO_MODE=${AI_DEMO_MODE:-true}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-eventmind_super_secure_secret_key_2026}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - eventmind-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventmind-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    networks:
      - eventmind-network

volumes:
  mongodb_data:
    driver: local

networks:
  eventmind-network:
    driver: bridge
